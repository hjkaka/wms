# ============================================
# WMS - Test Profile（集成测试专用环境）
# 指向独立的 wms_test 库，绝不触碰生产 wms 库
# ============================================

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/wms_test?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JWT ----------
jwt.secret=MyWmsSecretKeyForJwtToken2026MustBeLongEnough
jwt.expiration=86400000

# ---------- MyBatis ----------
# 测试关闭 SQL 刷屏
mybatis.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl