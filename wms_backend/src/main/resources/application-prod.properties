# ============================================
# WMS - Prod Profile（生产环境）
# 敏感信息通过环境变量注入，不由部署方写死；DB_PASSWORD 无回退（缺失即启动失败，防误连）
# ============================================

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://${DB_URL:localhost:3306/wms}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JWT ----------
# Secret key must be at least 32 characters; 通过环境变量注入，缺失时用备份值兜底
jwt.secret=${JWT_SECRET:MyWmsSecretKeyForJwtToken2026MustBeLongEnough}
# Token expiration in milliseconds: 86400000 = 24 hours
jwt.expiration=86400000

# ---------- MyBatis ----------
# 生产关闭 SQL 日志输出（避免敏感数据刷屏）
mybatis.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl

# ---------- Logging ----------
# 生产仅输出 INFO 级日志
logging.level.com.example.wms_backend=info
logging.level.org.springframework.security=info