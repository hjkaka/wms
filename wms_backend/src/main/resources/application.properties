# ============================================
# WMS Warehouse Management System - Common Config
# ============================================

# 默认激活 dev profile（本地开发直接启动即可）；
# 生产用 --spring.profiles.active=prod 覆盖（由部署方注入）
spring.profiles.active=dev

# ---------- Application ----------
spring.application.name=wms
server.port=8888

# ---------- MyBatis ----------
# Where to find Mapper XML files
mybatis.mapper-locations=classpath:mapper/*.xml
# Auto map snake_case to camelCase (user_name -> userName)
mybatis.configuration.map-underscore-to-camel-case=true

# ---------- Redis ----------
spring.redis.host=localhost
spring.redis.port=6379
# Use database 1 (project 0 is for the companion platform)
spring.redis.database=1
spring.redis.password=

# ---------- File Upload ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB