# ============================================
# WMS Warehouse Management System - Config
# ============================================

# ---------- Application ----------
spring.application.name=wms
server.port=8888

# ---------- MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/wms?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.username=root
# Change this to your MySQL password
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- MyBatis ----------
# Where to find Mapper XML files
mybatis.mapper-locations=classpath:mapper/*.xml
# Auto map snake_case to camelCase (user_name -> userName)
mybatis.configuration.map-underscore-to-camel-case=true
# Print SQL in console (for debugging, turn off in production)
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ---------- Redis ----------
spring.redis.host=localhost
spring.redis.port=6379
# Use database 1 (project 0 is for the companion platform)
spring.redis.database=1
spring.redis.password=

# ---------- JWT ----------
# Secret key must be at least 32 characters
jwt.secret=MyWmsSecretKeyForJwtToken2026MustBeLongEnough
# Token expiration in milliseconds: 86400000 = 24 hours
jwt.expiration=86400000

# ---------- File Upload ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ---------- Logging ----------
# DEBUG for development, change to INFO for production
logging.level.com.example.wms_backend=debug
logging.level.org.springframework.security=debug
